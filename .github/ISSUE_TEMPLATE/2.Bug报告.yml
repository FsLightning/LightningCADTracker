name: "Bug 报告"
description: 提交可复现缺陷、异常、安装或运行问题
title: "[Bug] "
labels: ["bug"]
projects: ["FsLightning/3"]
assignees: []

body:
  - type: input
    id: version
    attributes:
      label: LightningCAD 版本
      placeholder: 例如 v0.0.38
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: CAD 平台
      placeholder: 例如 AutoCAD 2025 / AutoCAD 2027 / ZWCAD 2022
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      placeholder: 简要描述问题现象
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 执行...
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 正常情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 截图、日志或补充材料
      placeholder: 可粘贴截图、日志片段或说明附件位置
